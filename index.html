<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>StudentOS | خطط. ادرس. ركّز. تذكّر. تطوّر</title>
    
    <!-- PWA & Windows 10 Meta Tags -->
    <meta name="description" content="StudentOS - المنصة التعليمية الذكية لطلاب وأساتذة التعليم الثانوي في الجزائر. Plan. Study. Focus. Remember. Improve." />
    <meta name="theme-color" content="#0f172a" />
    <meta name="background-color" content="#0b1120" />
    <meta name="application-name" content="StudentOS" />
    <meta name="msapplication-TileColor" content="#1ea150" />
    <meta name="msapplication-TileImage" content="/pwa-192x192.png" />
    <meta name="msapplication-config" content="none" />
    
    <!-- Apple / WebApp Meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StudentOS" />
    
    <!-- Manifest & Icons -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Google Fonts for Arabic (Tajawal, Cairo, Readex Pro) with preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Readex+Pro:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />

    <style>
      /* Fallback Instant Splash Screen Styles before JS bundles load */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0b1120;
        color: #ffffff;
        font-family: 'Tajawal', 'Cairo', system-ui, sans-serif;
        text-align: center;
        padding: 1.5rem;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #app-splash.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 1.25rem;
        animation: splashPulse 2s infinite ease-in-out;
      }
      .splash-title {
        font-size: 1.75rem;
        font-weight: 900;
        letter-spacing: -0.025em;
        margin: 0;
      }
      .splash-title span {
        color: #1ea150;
      }
      .splash-tagline {
        font-size: 0.875rem;
        color: #94a3b8;
        margin-top: 0.35rem;
        font-weight: 500;
      }
      .splash-loader {
        margin-top: 2rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: #64748b;
        font-size: 0.75rem;
      }
      .splash-spinner {
        width: 1rem;
        height: 1rem;
        border: 2px solid rgba(30, 161, 80, 0.2);
        border-top-color: #1ea150;
        border-radius: 50%;
        animation: splashSpin 0.7s linear infinite;
      }
      @keyframes splashSpin {
        to { transform: rotate(360deg); }
      }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased selection:bg-brand-500 selection:text-white transition-colors duration-200 overflow-x-hidden">
    <!-- Initial Splash Screen -->
    <div id="app-splash">
      <img src="/logo.svg" alt="StudentOS" class="splash-logo" />
      <h1 class="splash-title">Student<span>OS</span></h1>
      <p class="splash-tagline">Plan. Study. Focus. Remember. Improve.</p>
      <div class="splash-loader">
        <div class="splash-spinner"></div>
        <span>جارٍ تجهيز StudentOS...</span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
